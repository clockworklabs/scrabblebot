[package]
name = "scrabblebot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.12.0" }
log = "0.4"
rand = "0.8"
skillratings = "0.29.0"

[dev-dependencies]
# Native test harness: `spacetimedb::test_utils::TestContext` runs reducers
# against an in-memory datastore. Only active under `cargo test`.
spacetimedb = { version = "2.12.0", features = ["test-utils", "unstable"] }
